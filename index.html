<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Bus | Book intercity bus tickets</title>
<meta name="description" content="Browse routes, book seats and manage bus reservations with Smart Bus.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e1a2b;--navy:#12233d;--navy2:#1b3459;--amber:#f2b134;--amber2:#ffd27a;--teal:#12906b;--red:#c8372d;--bg:#f2f4f8;--card:#fff;--line:#e0e5ec;--muted:#5b6878;--r:14px;--head:'Sora',system-ui,sans-serif;--body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* hero */
.hero{background:radial-gradient(1200px 400px at 85% -10%,var(--navy2),transparent 60%),var(--navy);color:#fff;padding:22px 0 0;position:relative;overflow:hidden}
.top{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--amber);display:grid;place-items:center}
.brand{font-family:var(--head);font-weight:700;font-size:1.15rem}.brand small{display:block;font:500 .75rem var(--body);color:#9fb3d1;letter-spacing:0}
.hero-body{padding:48px 0 40px;max-width:640px}
.hero h1{font-size:clamp(2rem,5.2vw,3.3rem);line-height:1.08;font-weight:800}
.hero p{color:#b9c8df;font-size:1.05rem;margin:14px 0 24px;max-width:520px}
.cta{background:var(--amber);color:#2a1d00;border:0;border-radius:999px;padding:13px 26px;font-weight:700;cursor:pointer;transition:transform .15s,background .15s}
.cta:hover{background:var(--amber2);transform:translateY(-1px)}
.road{height:10px;background:repeating-linear-gradient(90deg,var(--amber) 0 28px,transparent 28px 56px) center/auto 3px no-repeat,#0b182b;animation:drive 2.4s linear infinite}
@keyframes drive{to{background-position:56px center}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:-34px;position:relative;z-index:2}
.stat{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:0 10px 30px rgba(14,26,43,.12)}
.stat b{display:block;font:700 1.6rem var(--head)}.stat span{color:var(--muted);font-size:.88rem}

/* nav */
nav{position:sticky;top:0;z-index:10;background:rgba(242,244,248,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-top:28px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 0;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:9px 16px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tab:hover{background:#e6eaf1;color:var(--ink)}.tab[aria-selected=true]{background:var(--navy);color:#fff}

main{padding:28px 0 50px;min-height:60vh}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px;margin-bottom:18px}
.head h2{font-size:1.5rem}.head p{margin:2px 0 0;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}

/* route card */
.route .time{font:700 1.5rem var(--head)}.route .id{float:right;color:var(--muted);font-size:.82rem;font-weight:600;background:#eef1f6;border-radius:6px;padding:2px 8px}
.path{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin:14px 0;font-weight:600}
.dots{height:2px;background:repeating-linear-gradient(90deg,#aab5c6 0 6px,transparent 6px 12px);position:relative}
.dots::after{content:"";position:absolute;right:-2px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--amber);border:2px solid var(--navy)}
.bar{height:8px;background:#e8ecf2;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.9rem;color:var(--muted)}
.price{font:700 1.15rem var(--head);color:var(--ink)}.price small{font:500 .8rem var(--body);color:var(--muted)}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--navy);color:#fff;transition:background .15s}
.btn:hover{background:var(--navy2)}.btn:disabled{background:#c9d1dd;cursor:not-allowed}
.btn.amber{background:var(--amber);color:#2a1d00}.btn.amber:hover{background:var(--amber2)}
.btn.ghost{background:#fff;color:var(--red);border:1px solid #efc5c1}.btn.ghost:hover{background:#fdf1f0}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:700}
.p-ok{background:#dff4ec;color:#0b6b4f}.p-mid{background:#fdf0d2;color:#8a5b00}.p-full{background:#fbe2df;color:#a5281f}.p-x{background:#e8ecf2;color:#4a5668}

/* forms */
.split{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start}
.field{margin-bottom:14px}label{display:block;font-weight:600;font-size:.88rem;margin-bottom:5px}
input[type=text],input[type=number],select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:1rem}
input:focus,select:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px rgba(242,177,52,.45)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--red);font-size:.85rem;margin-top:4px;min-height:1.1em}
.sum{background:var(--navy);color:#fff;border:0}.sum h3{font-size:1.05rem;margin-bottom:12px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #3a4f73;color:#c3d0e6}.row b{color:#fff}
.total{display:flex;justify-content:space-between;align-items:end;margin-top:14px}.total b{font:800 1.8rem var(--head);color:var(--amber)}

/* ticket */
.ticket{display:grid;grid-template-columns:1fr 150px;background:#fff;border-radius:var(--r);border:1px solid var(--line);position:relative;margin-bottom:14px;box-shadow:0 6px 20px rgba(14,26,43,.06)}
.ticket .main{padding:18px 20px;border-right:2px dashed var(--line)}
.ticket .stub{padding:18px 14px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:6px;background:#fafbfd;border-radius:0 var(--r) var(--r) 0}
.ticket:before,.ticket:after{content:"";position:absolute;right:139px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket:before{top:-11px;border-top-color:transparent}.ticket:after{bottom:-11px;border-bottom-color:transparent}
.ticket.cancelled{opacity:.62}.ticket.cancelled .main h3{text-decoration:line-through}
.ticket h3{font-size:1.2rem;margin-bottom:2px}.ticket .sub{color:var(--muted);font-size:.9rem}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px;font-size:.9rem}.facts span{color:var(--muted)}.facts b{display:block;color:var(--ink)}
.stub .code{font:800 1.25rem var(--head);letter-spacing:.02em}
.hero-ticket{animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}@keyframes pop{from{transform:scale(.94) translateY(10px);opacity:0}}

.empty{text-align:center;padding:44px 20px;color:var(--muted)}.empty h3{color:var(--ink);margin-bottom:6px}
.sched h3{font-size:1.05rem;margin:0 0 8px}.sched div.l{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}.tile span{color:var(--muted);font-size:.88rem}.tile b{display:block;font:700 1.7rem var(--head)}
.tile.k{background:var(--navy);color:#fff;border:0}.tile.k span{color:#9fb3d1}.tile.k b{color:var(--amber)}
.hbar{display:grid;grid-template-columns:70px 1fr 110px;gap:12px;align-items:center;margin:10px 0;font-size:.92rem}
.search{display:flex;gap:10px;margin-bottom:18px}.search input{flex:1}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.bad{background:var(--red)}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:.85rem;text-align:center}
@media(max-width:760px){.split{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:12px}.stat b{font-size:1.15rem}.stat span{font-size:.75rem}.ticket{grid-template-columns:1fr 112px}.ticket:before,.ticket:after{right:101px}.hbar{grid-template-columns:56px 1fr 84px}.hero-body{padding:34px 0 36px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="hero">
 <div class="wrap">
  <div class="top"><div class="logo" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#12233d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="3"/><path d="M3 11h18M8 4v7M16 4v7"/><circle cx="7.5" cy="19.5" r="1.5"/><circle cx="16.5" cy="19.5" r="1.5"/></svg></div><div class="brand">Smart Bus<small>Ticket booking &amp; reservations</small></div></div>
  <div class="hero-body">
   <h1>Pick a route. Choose your seats. Travel sorted.</h1>
   <p>Compare departures from Karachi, Hyderabad and Sukkur, see live seat counts and get your ticket in seconds.</p>
   <button class="cta" onclick="go('book')">Book a ticket</button>
  </div>
 </div>
 <div class="road" aria-hidden="true"></div>
</header>
<div class="wrap"><div class="stats" id="stats" aria-live="polite"></div></div>
<nav aria-label="Sections"><div class="wrap"><div class="tabs" role="tablist" id="tabs"></div></div></nav>
<main class="wrap" id="view"></main>
<footer><div class="wrap">Smart Bus Reservation System. Bookings live in this browser tab only and reset when you refresh.</div></footer>
<div id="toast" role="status"></div>

<script>
const CITIES=["Karachi","Hyderabad","Sukkur","Mirpur Khas","Lahore"];
const routes=[
["R101","Karachi","Hyderabad","08:00 AM",1200,40],["R102","Karachi","Sukkur","09:30 AM",2000,36],
["R103","Hyderabad","Mirpur Khas","11:00 AM",800,32],["R104","Karachi","Lahore","07:00 PM",5000,45],
["R105","Sukkur","Hyderabad","02:00 PM",1500,30]
].map(([id,from,to,time,price,total])=>({id,from,to,time,price,total,avail:total}));
const bookings=[],issued=new Set();let counter=1001,tab="routes",filter="all",preRoute="R101",lastTicket=null,onlyFree=false;

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rs=n=>"Rs. "+n.toLocaleString("en-US");
const findRoute=id=>routes.find(r=>r.id===id);
const posInt=v=>/^\d+$/.test(String(v).trim())&&parseInt(v,10)>0?parseInt(v,10):null;
const status=r=>r.avail===0?"Fully Booked":r.avail===r.total?"Available":"Partially Booked";
const pill=r=>{const s=status(r);return `<span class="pill ${s==="Available"?"p-ok":s==="Fully Booked"?"p-full":"p-mid"}">${s}</span>`};
const barColor=r=>r.avail===0?"var(--red)":r.avail/r.total>.5?"var(--teal)":"var(--amber)";
const bar=r=>`<div class="bar" role="img" aria-label="${r.avail} of ${r.total} seats free"><i style="width:${r.avail/r.total*100}%;background:${barColor(r)}"></i></div>`;
function newId(){let id="B"+counter;while(issued.has(id)){counter++;id="B"+counter}issued.add(id);counter++;return id}
let tt;function toast(t,bad){const e=$("#toast");e.textContent=t;e.className="on"+(bad?" bad":"");clearTimeout(tt);tt=setTimeout(()=>e.className="",3200)}
const empty=(h,p)=>`<div class="card empty"><h3>${h}</h3><p>${p}</p></div>`;
const head=(h,p,extra="")=>`<div class="head"><div><h2>${h}</h2><p>${p}</p></div>${extra}</div>`;

function routeCard(r){
 return `<article class="card route"><span class="id">${r.id}</span><div class="time">${r.time}</div>
 <div class="path"><span>${esc(r.from)}</span><span class="dots"></span><span>${esc(r.to)}</span></div>
 ${bar(r)}<div class="meta"><span>${r.avail===0?"No seats left":r.avail+" of "+r.total+" seats free"}</span>${pill(r)}</div>
 <div class="meta"><div class="price">${rs(r.price)} <small>per seat</small></div><button class="btn amber" ${r.avail===0?"disabled":""} onclick="preRoute='${r.id}';go('book')">${r.avail===0?"Sold out":"Book seats"}</button></div></article>`;
}
function ticket(b,cancelBtn){
 const r=findRoute(b.route),x=b.status==="Cancelled";
 return `<div class="ticket ${x?"cancelled":""}"><div class="main"><h3>${esc(r.from)} to ${esc(r.to)}</h3><div class="sub">${esc(b.name)}, age ${b.age}</div>
 <div class="facts"><div><span>Route</span><b>${r.id}</b></div><div><span>Departs</span><b>${r.time}</b></div><div><span>Seats</span><b>${b.seats}</b></div><div><span>Total fare</span><b>${rs(b.fare)}</b></div></div></div>
 <div class="stub"><span class="pill ${x?"p-x":"p-ok"}">${b.status}</span><div class="code">${b.id}</div>${cancelBtn&&!x?`<button class="btn ghost" onclick="cancelBooking('${b.id}')">Cancel</button>`:""}</div></div>`;
}
function cancelBooking(raw){
 const id=raw.trim().toUpperCase(),b=bookings.find(x=>x.id===id);
 if(!b){toast(`Booking ${id||"(empty)"} was not found. Check the ID and try again.`,1);return false}
 if(b.status!=="Confirmed"){toast(`Booking ${id} is already cancelled. No seats were changed.`,1);return false}
 const r=findRoute(b.route);b.status="Cancelled";r.avail+=b.seats;
 toast(`Booking ${id} cancelled. ${b.seats} seat(s) returned to ${r.id}.`);render();return true;
}

const views={
routes(){
 const chips=[["all","All routes"],["free","Seats available"],["sched","Departure schedule"]].map(([k,l])=>`<button class="chip" aria-pressed="${filter===k}" onclick="filter='${k}';render()">${l}</button>`).join("");
 let body;
 if(filter==="sched")body=`<div class="grid sched">${CITIES.map(c=>{const l=routes.filter(r=>r.from===c);return `<div class="card"><h3>${esc(c)}</h3>${l.length?l.map(r=>`<div class="l"><span>${r.id} to ${esc(r.to)}</span><b>${r.time}</b></div>`).join(""):`<div class="l"><span style="color:var(--muted)">No scheduled departures.</span></div>`}</div>`}).join("")}</div>`;
 else{const l=routes.filter(r=>filter==="all"||r.avail>0);body=l.length?`<div class="grid">${l.map(routeCard).join("")}</div>`:empty("All routes are full","Cancel a booking to free up seats.")}
 return head("Available routes","Live seat counts and fares for every departure.",`<div class="chips">${chips}</div>`)+body;
},
search(){
 return head("Find a route","Search by route ID (R101) or any city.")+`<div class="search"><input type="text" id="q" placeholder="Try Hyderabad or R104" aria-label="Search routes"><button class="btn" id="go">Search</button></div><div id="o"></div>`;
},
searchInit(){
 const run=()=>{const raw=$("#q").value.trim(),t=raw.toLowerCase(),o=$("#o");
  if(!t){o.innerHTML=empty("Enter a route ID or city","For example R101 or Karachi.");return}
  let m=routes.filter(r=>r.id.toLowerCase()===t);
  if(!m.length)m=routes.filter(r=>r.from.toLowerCase()===t||r.to.toLowerCase()===t);
  o.innerHTML=m.length?`<div class="grid">${m.map(routeCard).join("")}</div>`:empty(`No routes match "${esc(raw)}"`,"Check the spelling or try one of: "+CITIES.join(", ")+".");};
 $("#go").onclick=run;$("#q").onkeydown=e=>e.key==="Enter"&&run();
},
book(){
 return head("Book a ticket","Fill in the passenger details. Your fare updates as you type.")+
 `<div class="split"><form class="card" id="f" novalidate>
 <div class="field"><label for="n">Passenger name</label><input type="text" id="n" autocomplete="name"><div class="err" id="en"></div></div>
 <div class="two"><div class="field"><label for="a">Age</label><input type="number" id="a" min="1"><div class="err" id="ea"></div></div>
 <div class="field"><label for="s">Seats</label><input type="number" id="s" min="1" value="1"><div class="err" id="es"></div></div></div>
 <div class="field"><label for="r">Route</label><select id="r">${routes.map(r=>`<option value="${r.id}">${r.id}: ${esc(r.from)} to ${esc(r.to)} (${r.avail} left)</option>`).join("")}</select><div class="err" id="er"></div></div>
 <button class="btn amber" type="submit" style="width:100%;padding:14px">Confirm booking</button></form>
 <div><aside class="card sum"><h3>Fare summary</h3><div id="sum"></div></aside><div id="o" style="margin-top:16px"></div></div></div>`;
},
bookInit(){
 $("#r").value=preRoute;
 const upd=()=>{const r=findRoute($("#r").value),s=posInt($("#s").value)||0;
  $("#sum").innerHTML=`<div class="row"><span>Journey</span><b>${esc(r.from)} to ${esc(r.to)}</b></div><div class="row"><span>Departs</span><b>${r.time}</b></div><div class="row"><span>Fare per seat</span><b>${rs(r.price)}</b></div><div class="row"><span>Seats</span><b>${s}</b></div><div class="total"><span>Total fare</span><b>${rs(r.price*s)}</b></div>`;};
 ["r","s"].forEach(i=>$("#"+i).oninput=upd);upd();
 if(lastTicket)$("#o").innerHTML=`<div class="hero-ticket">${ticket(lastTicket)}</div>`;
 $("#f").onsubmit=e=>{e.preventDefault();
  ["en","ea","es","er"].forEach(i=>$("#"+i).textContent="");
  const name=$("#n").value.trim(),age=posInt($("#a").value),seats=posInt($("#s").value),route=findRoute($("#r").value);let bad=false;
  if(!name){$("#en").textContent="Enter the passenger's name.";bad=true}
  if(age===null){$("#ea").textContent="Enter a whole number above 0.";bad=true}
  if(seats===null){$("#es").textContent="Enter 1 or more seats.";bad=true}
  else if(route&&seats>route.avail){$("#es").textContent=`Only ${route.avail} seat(s) left on ${route.id}.`;bad=true}
  if(!route){$("#er").textContent="Choose a route.";bad=true}
  if(bad){toast("Booking not made. Fix the highlighted fields.",1);return}
  const b={id:newId(),name,age,route:route.id,seats,fare:route.price*seats,status:"Confirmed"};
  bookings.push(b);route.avail-=seats;lastTicket=b;preRoute=route.id;
  toast(`Booking ${b.id} confirmed.`);render();
 };
},
bookings(){
 return head("My bookings","Every booking, including cancelled ones.")+(bookings.length?bookings.map(b=>ticket(b,true)).join(""):empty("No bookings found","Book your first ticket to see it here.")+`<p style="text-align:center"><button class="btn amber" onclick="go('book')">Book a ticket</button></p>`);
},
cancel(){
 return head("Cancel a booking","Enter the booking ID from your ticket. Seats go back on sale straight away.")+`<div class="search"><input type="text" id="q" placeholder="e.g. B1001" aria-label="Booking ID"><button class="btn" id="go">Cancel booking</button></div>`;
},
cancelInit(){const run=()=>{if(cancelBooking($("#q").value))$("#q")&&($("#q").value="")};$("#go").onclick=run;$("#q").onkeydown=e=>e.key==="Enter"&&run()},
availability(){
 const l=routes.filter(r=>!onlyFree||r.avail>0);
 return head("Seat availability","Free seats against total capacity.",`<div class="chips"><button class="chip" aria-pressed="${onlyFree}" onclick="onlyFree=!onlyFree;render()">Only routes with seats</button></div>`)+
 (l.length?`<div class="card">${l.map(r=>`<div class="hbar"><b>${r.id}</b><div><div style="margin-bottom:5px;font-size:.9rem">${esc(r.from)} to ${esc(r.to)} ${pill(r)}</div>${bar(r)}</div><span style="text-align:right"><b>${r.avail}</b>/${r.total}</span></div>`).join("")}</div>`:empty("No routes to show","Every route is fully booked."));
},
report(){
 const conf=bookings.filter(b=>b.status==="Confirmed"),seats=conf.reduce((s,b)=>s+b.seats,0),rev=conf.reduce((s,b)=>s+b.fare,0),full=routes.filter(r=>r.avail===0).length;
 const by=routes.map(r=>{const l=conf.filter(b=>b.route===r.id);return {id:r.id,n:l.length,s:l.reduce((a,b)=>a+b.seats,0),f:l.reduce((a,b)=>a+b.fare,0)}}).filter(x=>x.n);
 const max=Math.max(1,...by.map(x=>x.f));
 const T=(l,v,k)=>`<div class="tile ${k?"k":""}"><span>${l}</span><b>${v}</b></div>`;
 return head("Booking report","Cancelled bookings are left out of seats reserved and revenue.")+
 `<div class="tiles">${T("Confirmed revenue",rs(rev),1)}${T("Total bookings created",bookings.length)}${T("Confirmed",conf.length)}${T("Cancelled",bookings.length-conf.length)}${T("Seats currently reserved",seats)}${T("Fully booked routes",full)}</div>`+
 `<div class="card"><h3 style="margin-bottom:8px">Confirmed revenue by route</h3>${by.length?by.map(x=>`<div class="hbar"><b>${x.id}</b><div class="bar"><i style="width:${x.f/max*100}%;background:var(--navy)"></i></div><span style="text-align:right">${rs(x.f)}</span></div>`).join(""):`<p style="color:var(--muted)">No confirmed bookings yet.</p>`}</div>`;
}};
const tabs=[["routes","Routes"],["search","Search"],["book","Book"],["bookings","My bookings"],["cancel","Cancel"],["availability","Availability"],["report","Report"]];
function go(k){tab=k;render();document.getElementById("tabs").scrollIntoView({block:"start"})}
function render(){
 const conf=bookings.filter(b=>b.status==="Confirmed");
 $("#stats").innerHTML=`<div class="stat"><b>${routes.reduce((s,r)=>s+r.avail,0)}</b><span>Seats available</span></div><div class="stat"><b>${conf.length}</b><span>Active bookings</span></div><div class="stat"><b>${rs(conf.reduce((s,b)=>s+b.fare,0))}</b><span>Confirmed revenue</span></div>`;
 $("#tabs").innerHTML=tabs.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${k===tab}" onclick="go('${k}')">${l}</button>`).join("");
 $("#view").innerHTML=views[tab]();
 if(views[tab+"Init"])views[tab+"Init"]();
}
render();
</script>
</body>
