<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Bus Reservation System</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1a1d21;--muted:#5f6b7a;--accent:#0b6e4f;--line:#dde1e6;--err:#b42318;--ok:#0b6e4f}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1d2125;--text:#e8eaed;--muted:#9aa5b1;--accent:#3ecf9a;--line:#2d333a;--err:#ff7b72;--ok:#3ecf9a}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
header{padding:24px 16px;text-align:center}h1{margin:0;font-size:1.6rem}header p{margin:4px 0 0;color:var(--muted)}
main{max-width:860px;margin:0 auto;padding:0 16px 40px}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}
button,input,select{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
button{cursor:pointer}button.on,button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted)}
.msg{padding:10px 12px;border-radius:8px;margin-top:12px;border:1px solid var(--line);white-space:pre-line}
.err{color:var(--err)}.ok{color:var(--ok)}.muted{color:var(--muted)}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:2px}.field{margin-bottom:10px}.field input,.field select{width:100%;max-width:420px}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:16px}
</style>
</head>
<body>
<header><h1>🚌 Smart Bus Reservation System</h1><p>Browse routes, book seats, cancel and view reports</p></header>
<main>
<nav id="nav"></nav>
<div class="card" id="view"></div>
<footer>Data is kept in your browser tab only and is lost when you refresh the page.</footer>
</main>
<script>
const CITIES=["Karachi","Hyderabad","Sukkur","Mirpur Khas","Lahore"];
const routes=[
["R101","Karachi","Hyderabad","08:00 AM",1200,40],["R102","Karachi","Sukkur","09:30 AM",2000,36],
["R103","Hyderabad","Mirpur Khas","11:00 AM",800,32],["R104","Karachi","Lahore","07:00 PM",5000,45],
["R105","Sukkur","Hyderabad","02:00 PM",1500,30]
].map(([id,from,to,time,price,total])=>({id,from,to,time,price,total,avail:total}));
const bookings=[],issued=new Set();let counter=1001;

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rs=n=>"Rs. "+n.toLocaleString("en-US");
const findRoute=id=>routes.find(r=>r.id===id);
const status=r=>r.avail===0?"Fully Booked":r.avail===r.total?"Available":"Partially Booked";
const msg=(t,cls="")=>`<div class="msg ${cls}">${esc(t)}</div>`;
const table=(head,rows)=>`<div class="table-wrap"><table><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div>`;
const posInt=v=>/^\d+$/.test(String(v).trim())&&parseInt(v,10)>0?parseInt(v,10):null;
function newId(){let id="B"+counter;while(issued.has(id)){counter++;id="B"+counter}issued.add(id);counter++;return id}
const label=r=>`${r.id} – ${r.from} → ${r.to} (Rs. ${r.price}, ${r.avail} left)`;

const views={
routes(){
 return `<div class="row"><select id="f"><option value="all">All routes</option><option value="free">Only seats available</option><option value="sched">Schedule by departure city</option></select></div><div id="o"></div>`;
},
routesInit(){
 const draw=()=>{const f=$("#f").value,o=$("#o");
  if(f==="sched"){o.innerHTML=CITIES.map(c=>{const l=routes.filter(r=>r.from===c);
   return `<h3>${esc(c)}</h3>`+(l.length?l.map(r=>`<div>${r.id} → ${esc(r.to)} | ${r.time}</div>`).join(""):`<div class="muted">No scheduled departures.</div>`)}).join("");return}
  const l=routes.filter(r=>f==="all"||r.avail>0);
  o.innerHTML=l.length?table(["No.","Route","Journey","Depart","Fare","Seats"],l.map((r,i)=>[i+1,r.id,r.from+" → "+r.to,r.time,"Rs. "+r.price,r.avail===0?"Fully Booked":r.avail+"/"+r.total])):msg("No routes have seats available.");};
 $("#f").onchange=draw;draw();
},
search(){return `<div class="row"><input id="q" placeholder="Route ID or city"><button class="primary" id="go">Search</button></div><div id="o"></div>`},
searchInit(){
 const run=()=>{const t=$("#q").value.trim().toLowerCase();if(!t){$("#o").innerHTML=msg("Search term cannot be empty.","err");return}
  let m=routes.filter(r=>r.id.toLowerCase()===t);
  if(!m.length)m=routes.filter(r=>r.from.toLowerCase()===t||r.to.toLowerCase()===t);
  $("#o").innerHTML=m.length?table(["Route","Journey","Depart","Fare","Seats left"],m.map(r=>[r.id,r.from+" → "+r.to,r.time,"Rs. "+r.price,r.avail])):msg(`No routes found matching '${$("#q").value.trim()}'.`,"err");};
 $("#go").onclick=run;$("#q").onkeydown=e=>e.key==="Enter"&&run();
},
book(){
 return `<div class="field"><label>Passenger name</label><input id="n"></div><div class="field"><label>Age</label><input id="a" inputmode="numeric"></div>
 <div class="field"><label>Route</label><select id="r">${routes.map(r=>`<option value="${r.id}">${esc(label(r))}</option>`).join("")}</select></div>
 <div class="field"><label>Number of seats</label><input id="s" inputmode="numeric"></div><button class="primary" id="go">Book ticket</button><div id="o"></div>`;
},
bookInit(){
 $("#go").onclick=()=>{const o=$("#o"),fail=t=>o.innerHTML=msg("Booking failed: "+t,"err");
  const name=$("#n").value.trim();if(!name)return fail("name cannot be empty.");
  const age=posInt($("#a").value);if(age===null)return fail("age must be a positive whole number.");
  const route=findRoute($("#r").value);if(!route)return fail("route does not exist.");
  const seats=posInt($("#s").value);if(seats===null)return fail("seats must be a whole number greater than zero.");
  if(seats>route.avail)return fail(`only ${route.avail} seat(s) available on ${route.id}.`);
  const b={id:newId(),name,age,route:route.id,seats,fare:route.price*seats,status:"Confirmed"};
  bookings.push(b);route.avail-=seats;
  o.innerHTML=msg(`Booking confirmed!\nBooking ID: ${b.id}\nPassenger: ${name}\nRoute: ${route.id} (${route.from} → ${route.to})\nSeats booked: ${seats}\nFare per seat: ${rs(route.price)}\nTotal fare: ${rs(b.fare)}\nStatus: Confirmed`,"ok");
  [...$("#r").options].forEach(op=>{op.textContent=label(findRoute(op.value))});
 };
},
bookings(){
 return bookings.length?table(["No.","ID","Passenger","Age","Route","Seats","Fare","Status"],bookings.map((b,i)=>[i+1,b.id,b.name,b.age,b.route,b.seats,rs(b.fare),b.status])):msg("No bookings found.");
},
cancel(){return `<div class="row"><input id="q" placeholder="Booking ID e.g. B1001"><button class="primary" id="go">Cancel booking</button></div><div id="o"></div>`},
cancelInit(){
 $("#go").onclick=()=>{const id=$("#q").value.trim().toUpperCase(),o=$("#o"),b=bookings.find(x=>x.id===id);
  if(!b)return o.innerHTML=msg(`Booking ID '${id}' was not found. No changes made.`,"err");
  if(b.status!=="Confirmed")return o.innerHTML=msg(`Booking ${id} is already cancelled. No changes made.`,"err");
  const r=findRoute(b.route);b.status="Cancelled";r.avail+=b.seats;
  o.innerHTML=msg(`Booking ${id} has been cancelled.\nSeats restored: ${b.seats}\nRoute ${r.id} available seats: ${r.avail}`,"ok");};
},
availability(){
 return `<div class="row"><label><input type="checkbox" id="f"> Only routes with seats available</label></div><div id="o"></div>`;
},
availabilityInit(){
 const draw=()=>{const l=routes.filter(r=>!$("#f").checked||r.avail>0);
  $("#o").innerHTML=l.length?table(["Route","Journey","Seats","Status"],l.map(r=>[r.id,r.from+" → "+r.to,r.avail+"/"+r.total,status(r)])):msg("No routes to show.");};
 $("#f").onchange=draw;draw();
},
report(){
 const conf=bookings.filter(b=>b.status==="Confirmed");
 const seats=conf.reduce((s,b)=>s+b.seats,0),rev=conf.reduce((s,b)=>s+b.fare,0);
 const full=routes.filter(r=>r.avail===0).length;
 const byRoute=routes.map(r=>{const l=conf.filter(b=>b.route===r.id);return l.length?[r.id,l.length,l.reduce((s,b)=>s+b.seats,0),rs(l.reduce((s,b)=>s+b.fare,0))]:null}).filter(Boolean);
 return table(["Measure","Value"],[["Total bookings created",bookings.length],["Confirmed bookings",conf.length],["Cancelled bookings",bookings.length-conf.length],["Seats currently reserved",seats],["Confirmed revenue",rs(rev)],["Fully booked routes",full]])
  +(byRoute.length?`<h3>Confirmed bookings by route</h3>`+table(["Route","Bookings","Seats","Revenue"],byRoute):"");
}};
const tabs=[["routes","View Routes"],["search","Search"],["book","Book a Ticket"],["bookings","My Bookings"],["cancel","Cancel"],["availability","Seat Availability"],["report","Report"]];
function show(k){
 $("#nav").innerHTML=tabs.map(([key,l])=>`<button data-k="${key}" class="${key===k?"on":""}">${l}</button>`).join("");
 $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>show(b.dataset.k));
 $("#view").innerHTML=views[k]();
 if(views[k+"Init"])views[k+"Init"]();
}
show("routes");
</script>
</body>
</html>
